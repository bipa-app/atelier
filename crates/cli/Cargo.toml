[package]
name = "atelier-ws"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "atelier — versioned workspaces for humans and AI agents"
readme = "../../README.md"
keywords = ["versioning", "workspace", "agents", "diff", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
atelier-hosted = { version = "0.1.0", path = "../hosted" }
atelier-sdk = { version = "0.3.0", path = "../core" }
atelier-surface = { version = "0.3.0", path = "../surface" }
clap.workspace = true
ctrlc.workspace = true
time.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true
