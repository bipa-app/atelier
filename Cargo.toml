[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/diff-core",
    "crates/format-docx",
    "crates/hosted",
    "crates/source-remote",
    "crates/surface",
    "crates/cli",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bipa-app/atelier"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
# The hosted serve loop's shutdown seam: release on ctrl-c (ADR-0013).
ctrlc = "3"
tempfile = "3"
# jj-lib's default `git` feature is required: workspaces are colocated git repos.
jj-lib = "=0.44.0"
pollster = "0.4"
futures = { version = "0.3", default-features = false, features = ["std"] }
gix-hash = "0.25"
# fs events only trigger snapshots; nothing from notify reaches an output path.
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3", default-features = false, features = ["std", "text"] }
sha2 = "0.10"
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
rustyriver = "0.1.0"
tokio = { version = "1", default-features = false, features = ["rt"] }
url = "2.5"
quick-xml = "0.41"
# deflate-flate2-zlib-rs reads and writes the one method Word uses (flate2 on
# the zlib-rs backend); the blanket `deflate` feature would also pull in the
# zopfli compressor, and bare `deflate-flate2` leaves flate2 with no backend.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The HTTP transports' server: synchronous like the core, no runtime.
tiny_http = "0.12"
time = { version = "0.3", default-features = false, features = ["formatting"] }
assert_cmd = "2"
predicates = { version = "3", default-features = false, features = ["diff", "regex"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = 0 }
pedantic = { level = "warn", priority = 1 }

allow_attributes = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
implicit_clone = { level = "warn", priority = 2 }
redundant_test_prefix = { level = "warn", priority = 2 }
redundant_type_annotations = { level = "warn", priority = 2 }
str_to_string = { level = "warn", priority = 2 }
todo = { level = "warn", priority = 2 }
try_err = { level = "warn", priority = 2 }
unimplemented = { level = "warn", priority = 2 }
unwrap_used = { level = "warn", priority = 2 }
panic = { level = "warn", priority = 2 }

cast-possible-wrap = { level = "allow", priority = 3 }
cast-precision-loss = { level = "allow", priority = 3 }
cast_possible_truncation = { level = "allow", priority = 3 }
cast_sign_loss = { level = "allow", priority = 3 }
inconsistent_digit_grouping = { level = "allow", priority = 3 }
missing-errors-doc = { level = "allow", priority = 3 }
missing_panics_doc = { level = "allow", priority = 3 }
result_large_err = { level = "allow", priority = 3 }
struct_excessive_bools = { level = "allow", priority = 3 }
too_many_arguments = {  level = "allow", priority = 3 }
too_many_lines = { level = "warn", priority = 3 }
unreadable_literal = { level = "allow", priority = 3 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
