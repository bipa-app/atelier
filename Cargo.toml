[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/diff-core",
    "crates/format-docx",
    "crates/surface",
    "crates/cli",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
jj-lib = "=0.44.0"
pollster = "0.4"
futures = "0.3"
gix-hash = "0.25"
rusqlite = { version = "0.40.1", features = ["bundled"] }
toml = "0.9"
serde = { version = "1", features = ["derive"] }
